[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "databricks-prompt-ops"
version = "0.1.0"
description = "Prompt management, validation, evaluation, and storage utilities for Databricks-hosted applications."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
databricks_prompt_ops = ["prompt_management/templates/*.yaml"]
